---
app-id: pm.mirko.Atoms
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: atoms

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/icons:create

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.a'
  - '*.la'

modules:
  - name: meson
    buildsystem: simple
    build-commands:
      - pip3 install --ignore-installed --no-index --no-deps --no-build-isolation --prefix=/app meson-1.10.0.tar.gz
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/45/76/c2f4cff5dabcd64711bd327dd00fd22ec603bed6a928dd5d058044d568d8/meson-1.10.0.tar.gz
        sha256: 8071860c1f46a75ea34801490fd1c445c9d75147a65508cd3a10366a7006cc1c

  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=true
      - -Dvapi=true
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        commit: 1c963c51514581c41b9bdae08cdf69171265cdda

  - name: libpeas
    buildsystem: meson
    config-opts:
      - -Dgjs=false
      - -Dlua51=false
      - -Dpython3=false
      - -Dintrospection=true
      - -Dvapi=true
      - -Dgtk_doc=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libpeas.git
        commit: 39a2b9c55deaa5246b99b502b53896d3ad41846b

  - name: sassc
    buildsystem: simple
    build-commands:
      - make -j$(nproc) SASS_LIBSASS_PATH="$PWD/libsass"
      - install -Dm755 bin/sassc /app/bin/sassc
    sources:
      - type: git
        url: https://github.com/sass/sassc.git
        commit: 66f0ef37e7f0ad3a65d2f481eff09d09408f42d0
      - type: git
        url: https://github.com/sass/libsass.git
        commit: 7037f03fabeb2b18b5efa84403f5a6d7a990f460
        dest: libsass

  - name: libsingularity
    buildsystem: meson
    config-opts:
      - -Dsystem=false
      - -Dintrospection=false
    sources:
      - type: git
        url: https://github.com/singularityos-lab/libsingularity.git
        commit: dbf6622952337c8e5f11dba2e05592e60165e5e8

  - name: vte
    buildsystem: meson
    config-opts:
      - -Dapp=false
      - -Ddocs=false
      - -Dgir=true
      - -Dglade=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=true
      - -D_systemd=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        commit: f2223e45d7f04c5383c59e76772501f0ed4215bc
      - type: git
        url: https://github.com/fastfloat/fast_float.git
        commit: 88b1e5321c6918cbe091afd76728296290668403
        dest: subprojects/fast_float
      - type: git
        url: https://github.com/simdutf/simdutf.git
        commit: fd476229424b40ae71a58dd5a205795c3d76b5f1
        dest: subprojects/simdutf
      - type: shell
        commands:
          - cp subprojects/packagefiles/fast_float/meson.build subprojects/fast_float/
          - cp subprojects/packagefiles/simdutf/meson.build subprojects/simdutf/
          - cp subprojects/packagefiles/simdutf/meson.options subprojects/simdutf/

  - name: atoms
    buildsystem: meson
    sources:
      - type: dir
        path: .
